# Local development stack. `docker compose up` should give a working, seeded system
# with no manual steps beyond `cp .env.example .env`.
#
# Kept deliberately close to production: the API talks to Mongo over a URI and to object
# storage over the S3 API, exactly as it does against Atlas and R2. Only env values change.

services:
  mongo:
    # Mongo 8 to match what mongodb-memory-server pulls for the test suite (8.2.6).
    # Running a different major locally than in tests is how you find a bug in production.
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # TODO(chore/dockerize): pin to a dated RELEASE tag. Left floating because the tag has
    # to be verified against a running daemon, and minio may be dropped entirely if
    # feat/evidence-upload is cut.
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # one-shot: creates the bucket so the API does not have to handle a missing bucket
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-visit-evidence} &&
      exit 0
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/${MONGO_DB_NAME:-mystery-shopping}
      S3_ENDPOINT: http://minio:9000
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules

volumes:
  mongo-data:
  minio-data:
