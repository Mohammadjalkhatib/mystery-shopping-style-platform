# Local development stack.
#
#   cp .env.example .env && docker compose up --build
#
# That is the whole procedure. The stack seeds itself and needs no manual step (CLAUDE.md §7).
#
# Kept deliberately close to production: the API talks to Mongo over a URI exactly as it does
# to Atlas. Only env values change.

services:
  # ---------------------------------------------------------------------- mongo
  #
  # A single-node REPLICA SET, not a standalone.
  #
  # Design rule 9 makes report submission one transaction across report, session state, its
  # event and the outbox row. MongoDB refuses multi-document transactions outside a replica
  # set, so a standalone container meant `submit` threw
  # "Transaction numbers are only allowed on a replica set member or mongos" -- and ONLY
  # locally, because Atlas M0 is a replica set. The bug would have been invisible until
  # someone ran the documented compose command.
  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Self-initiating: the first probe creates the replica set, later probes confirm it.
      # `mongo:27017` is the advertised host, so it must be resolvable from inside the
      # network -- which is why clients connect with `?replicaSet=rs0` rather than by IP.
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }
        "
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  # ------------------------------------------------------------------------ api
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    restart: unless-stopped
    env_file: .env
    environment:
      # replicaSet=rs0 is required, not decorative: without it the driver treats the node as
      # a standalone and transactions fail exactly as they did before.
      MONGO_URI: mongodb://mongo:27017/${MONGO_DB_NAME:-mystery-shopping}?replicaSet=rs0
      WEB_PUBLIC_URL: http://localhost:5173
      # Set here, not only in .env, so `docker compose up` exercises the S3 path by default.
      # Remove these four and the api falls back to GridFS -- which is what the deployed demo
      # does, since it has no bucket.
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-visit-evidence}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-auto}
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
      # The bucket must exist before the api tries to write to it.
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src
      # Anonymous volumes so the image's node_modules survive the bind mounts above. Only
      # `src` is mounted precisely to avoid needing these for the whole app directory.
      - /app/node_modules
      - /app/apps/api/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ----------------------------------------------------------------------- seed
  #
  # One-shot, and it runs on every `up` on purpose: the seed is idempotent, and re-seeding
  # is the documented way to reset a stale demo (its pending sessions are re-clocked so the
  # reaper cannot leave them abandoned and unrevivable -- see D-012).
  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/${MONGO_DB_NAME:-mystery-shopping}?replicaSet=rs0
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    command: ["sh", "-c", "npm run build --workspace @msp/api && node apps/api/dist/db/seed.js"]

  # ------------------------------------------------------------------------ web
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    restart: unless-stopped
    environment:
      # The browser talks to the API on the HOST, not inside the compose network, so this is
      # localhost rather than `api`.
      VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./packages/shared/src:/app/packages/shared/src
      - /app/node_modules
      - /app/apps/web/node_modules

  # S3-compatible object storage for evidence photos (D-028). The api falls back to
  # GridFS when the S3_* variables are absent, so this service is optional -- but with
  # it present, `docker compose up` exercises the same code path as production.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"   # the browser console, handy for confirming an upload landed
    volumes:
      - minio-data:/data

  # One-shot. Waits for minio, creates the bucket, exits. This is the readiness signal.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin}; do
        echo 'waiting for minio...'; sleep 1;
      done;
      mc mb --ignore-existing local/${S3_BUCKET:-visit-evidence};
      echo 'bucket ready';
      "


volumes:
  mongo-data:
  minio-data:

# ---------------------------------------------------------------------------
# minio is HERE now (D-028), and the three traps the previous note named are each
# handled rather than rediscovered:
#
# 1. Both images are PINNED. `:latest` on a storage service means a rebuild can change
#    the on-disk format under a volume you still care about.
# 2. NO healthcheck on minio itself. Recent minio images ship neither `curl` nor `wget`,
#    so a healthcheck using either never passes and `depends_on: service_healthy` hangs
#    forever -- which presents as a broken build rather than a missing binary.
# 3. Readiness is proved by `minio-init` instead: `mc` retries until the server answers,
#    creates the bucket, and exits 0. `service_completed_successfully` is a real signal,
#    and the api waits on THAT.
# ---------------------------------------------------------------------------
