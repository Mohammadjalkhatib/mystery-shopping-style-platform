server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The app routes by role in the client, so any path must return index.html rather than a
  # 404 -- otherwise a refresh on a deep link breaks.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets are immutable; index.html must never be cached or a deploy is invisible.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
